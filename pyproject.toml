[project]
name = "zmp"
version = "0.1.0"
description = "Портативное tui приложение для установки модификаций на Zapret"
authors = [
    {name = "peshk0v",email = "peshoff@proton.me"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "textual (>=8.2.8,<9.0.0)",
    "rich (>=14.2.0)",
    "httpx (>=0.27.0,<0.28.0)"
]

[project.scripts]
zmp = "zmp.main:cli"

[tool.poetry]
packages = [{include = "zmp", from = "src"}]
include = ["src/zmp/data/*"]

[tool.poetry.group.dev.dependencies]
nuitka = "^2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
